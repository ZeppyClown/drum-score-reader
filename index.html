<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
  <style type="text/tailwindcss">
    .key-cell {
      @apply flex flex-col items-center justify-center bg-gray-700 hover:bg-gray-600
             rounded-md py-2 cursor-default transition-colors duration-75;
    }
    .key-cell.pressed {
      @apply bg-blue-500;
    }
    .key-num {
      @apply text-xs text-gray-400 leading-none mb-0.5;
    }
    .key-lbl {
      @apply text-xs font-bold text-white leading-none;
    }
    .key-shift {
      @apply text-[9px] text-sky-300 leading-none mt-0.5;
    }
  </style>
</head>
<body class="bg-white overflow-hidden">

  <!-- Top bar -->
  <div class="fixed top-0 left-0 right-0 h-10 bg-gray-100 border-b border-gray-200 flex items-center px-3 z-50">
    <button id="menu-btn" class="text-gray-600 hover:bg-gray-200 rounded px-2 py-1 text-base leading-none">
      ☰
    </button>
  </div>

  <!-- Backdrop — closes the menu on outside click -->
  <div id="backdrop" class="hidden fixed top-10 inset-0 z-30"></div>

  <!-- Side menu -->
  <div id="side-menu" class="fixed top-10 left-0 bottom-0 w-60 bg-gray-50 border-r border-gray-200 z-40 p-5 -translate-x-full transition-transform duration-200 ease-in-out">

    <p class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">Bars per line</p>

    <!-- Flowbite warning alert (hidden until triggered) -->
    <div id="bpl-alert" class="hidden flex items-start gap-2 p-3 mb-3 text-sm text-yellow-800 rounded-lg bg-yellow-50 border border-yellow-300" role="alert">
      <svg class="shrink-0 mt-0.5 w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.506 9.506 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
      </svg>
      <span>Only values between <strong>2 and 8</strong> are accepted.</span>
    </div>

    <input
      id="bpl-input"
      type="number"
      placeholder="4"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
    />

  </div>

  <!-- Score area -->
  <div id="score" class="fixed top-10 left-0 right-0 bottom-0 overflow-auto p-5"></div>

  <!-- Floating drum keypad -->
  <div id="keypad" class="fixed z-50 rounded-xl shadow-2xl bg-gray-800 text-white select-none" style="top:60px;right:24px;width:152px;">

    <!-- Drag handle -->
    <div id="keypad-handle" class="px-3 py-2 border-b border-gray-700 cursor-grab flex items-center gap-2">
      <span class="text-gray-500 text-sm">⠿</span>
      <span class="text-xs font-semibold text-gray-300 tracking-wide">Drum Keys</span>
    </div>

    <!-- Numpad grid (mirrors a standard numpad layout) -->
    <div class="p-2 grid grid-cols-3 gap-1.5">

      <div class="key-cell" data-key="7"><span class="key-num">7</span><span class="key-lbl">HHx</span></div>
      <div class="key-cell" data-key="8"><span class="key-num">8</span><span class="key-lbl">sn</span></div>
      <div class="key-cell" data-key="9"><span class="key-num">9</span><span class="key-lbl">rd</span><span class="key-shift">⇧ bell</span></div>

      <div class="key-cell" data-key="4"><span class="key-num">4</span><span class="key-lbl">HHo</span><span class="key-shift">⇧ HH½</span></div>
      <div class="key-cell" data-key="5"><span class="key-num">5</span><span class="key-lbl">SS</span></div>
      <div class="key-cell" data-key="6"><span class="key-num">6</span><span class="key-lbl">Lt</span><span class="key-shift">⇧ Lt2</span></div>

      <div class="key-cell" data-key="1"><span class="key-num">1</span><span class="key-lbl">cr</span></div>
      <div class="key-cell" data-key="2"><span class="key-num">2</span><span class="key-lbl">ht</span></div>
      <div class="key-cell" data-key="3"><span class="key-num">3</span><span class="key-lbl">MT</span></div>

      <div class="key-cell col-span-2" data-key="0"><span class="key-num">0</span><span class="key-lbl">BD</span><span class="key-shift">⇧ HHp</span></div>
      <div class="key-cell" data-key="."><span class="key-num">.</span><span class="key-lbl">alt</span></div>

    </div>
  </div>

  <script src="node_modules/vexflow/build/cjs/vexflow.js"></script>
  <script type="module" src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
