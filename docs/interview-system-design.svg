<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1180" height="690" fill="#ffffff"/>
  <text x="20" y="40" font-size="22" font-weight="700">DrumHub: image to drum notes, system design</text>
  <text x="20" y="62" font-size="13" fill="#4b5563">Top: what runs when a user imports a picture. Bottom: how the model was built.</text>

  <!-- user's computer -->
  <rect x="20" y="84" width="860" height="400" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 5"/>
  <text x="34" y="106" font-size="12" font-weight="700" fill="#4b5563">ON THE USER'S COMPUTER (works offline)</text>

  <!-- renderer -->
  <rect x="40" y="120" width="220" height="340" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="144" font-size="14" font-weight="700" text-anchor="middle">Electron page</text>
  <g font-size="11" text-anchor="middle">
    <rect x="55" y="160" width="190" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="150" y="184" font-size="13" font-weight="700">Import screen</text>
    <text x="150" y="204">paste, pick a file,</text>
    <text x="150" y="220">fix the bar boxes</text>

    <rect x="55" y="260" width="190" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="150" y="284" font-size="13" font-weight="700">import.js</text>
    <text x="150" y="304">32-slot grid to notes,</text>
    <text x="150" y="320">rests fill the gaps</text>

    <rect x="55" y="360" width="190" height="80" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="150" y="384" font-size="13" font-weight="700">Score (VexFlow)</text>
    <text x="150" y="404">bar added, marked</text>
    <text x="150" y="420">UNCHECKED</text>
  </g>
  <line x1="150" y1="340" x2="150" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- main -->
  <rect x="340" y="120" width="220" height="340" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="144" font-size="14" font-weight="700" text-anchor="middle">Electron main (Node)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="355" y="160" width="190" height="80" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="450" y="184" font-size="13" font-weight="700">openai-omr.cjs</text>
    <text x="450" y="204">checks consent, budget, rate</text>
    <text x="450" y="220">API key never leaves here</text>

    <rect x="355" y="260" width="190" height="80" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="450" y="284" font-size="13" font-weight="700">omr-service.cjs</text>
    <text x="450" y="304">starts the Python service,</text>
    <text x="450" y="320">sends it pages and bars</text>

    <rect x="355" y="360" width="190" height="80" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="450" y="384" font-size="13" font-weight="700">page-import.cjs</text>
    <text x="450" y="404">crops each box, saves each</text>
    <text x="450" y="420">result, resumes after restart</text>
  </g>

  <!-- page <-> main -->
  <g font-size="11" text-anchor="middle">
    <text x="300" y="192">image</text>
    <line x1="262" y1="200" x2="338" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="300" y="256" font-weight="700" fill="#4b5563">IPC</text>
    <text x="300" y="292">notes</text>
    <line x1="338" y1="300" x2="262" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- python service -->
  <rect x="640" y="240" width="220" height="220" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="750" y="264" font-size="14" font-weight="700" text-anchor="middle">Python service (FastAPI)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="655" y="280" width="190" height="75" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="750" y="302" font-size="13" font-weight="700">POST /segment</text>
    <text x="750" y="321">finds staves and barlines</text>
    <text x="750" y="337">OpenCV + PyMuPDF, no AI</text>

    <rect x="655" y="370" width="190" height="75" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="750" y="392" font-size="13" font-weight="700">POST /predict</text>
    <text x="750" y="411">ONNX Runtime + omr.onnx</text>
    <text x="750" y="427">about 16 ms per bar</text>
  </g>

  <!-- main <-> python -->
  <line x1="562" y1="317" x2="638" y2="317" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="562" y1="407" x2="638" y2="407" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g font-size="11" text-anchor="middle">
    <text x="600" y="358" font-weight="700" fill="#4b5563">HTTP</text>
    <text x="600" y="373" fill="#4b5563">localhost</text>
  </g>

  <!-- cloud -->
  <text x="930" y="130" font-size="12" font-weight="700" fill="#4b5563">CLOUD (optional)</text>
  <rect x="930" y="140" width="230" height="100" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <g font-size="11" text-anchor="middle">
    <text x="1045" y="168" font-size="14" font-weight="700">OpenAI Responses API</text>
    <text x="1045" y="192">GPT-5.6 Sol, high reasoning</text>
    <text x="1045" y="210">strict JSON schema, store: false</text>
  </g>
  <line x1="562" y1="190" x2="928" y2="190" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="745" y="181" font-size="11" text-anchor="middle">HTTPS, only if an adult turned cloud help on</text>

  <!-- model hand-off -->
  <path d="M1056 570 V510 H750 V462" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="905" y="503" font-size="11" text-anchor="middle">omr.onnx + omr_config.json (9 MB)</text>

  <!-- training -->
  <text x="20" y="556" font-size="12" font-weight="700" fill="#4b5563">TRAINING (on my Mac, once per release)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20" y="570" width="208" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="124" y="596" font-size="13" font-weight="700">Source songs</text>
    <text x="124" y="618">289 songs: Reflow + Songsterr</text>
    <text x="124" y="635">each has a PDF and a tab file</text>

    <rect x="253" y="570" width="208" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="357" y="596" font-size="13" font-weight="700">Data prep</text>
    <text x="357" y="618">tab file → note labels</text>
    <text x="357" y="635">PDF → one image per bar</text>

    <rect x="486" y="570" width="208" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="590" y="596" font-size="13" font-weight="700">Strict subset</text>
    <text x="590" y="618">19,942 bars</text>
    <text x="590" y="635">split by song: train / val / test</text>

    <rect x="719" y="570" width="208" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="823" y="596" font-size="13" font-weight="700">Train</text>
    <text x="823" y="618">MobileNetV3-Small</text>
    <text x="823" y="635">frozen backbone, then fine-tune</text>

    <rect x="952" y="570" width="208" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="1056" y="596" font-size="13" font-weight="700">Evaluate, export, release</text>
    <text x="1056" y="618">2,184 held-out test bars</text>
    <text x="1056" y="635">ONNX export, hashes recorded</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="230" y1="615" x2="251" y2="615" marker-end="url(#arrow)"/>
    <line x1="463" y1="615" x2="484" y2="615" marker-end="url(#arrow)"/>
    <line x1="696" y1="615" x2="717" y2="615" marker-end="url(#arrow)"/>
    <line x1="929" y1="615" x2="950" y2="615" marker-end="url(#arrow)"/>
  </g>
</svg>
